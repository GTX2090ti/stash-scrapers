name: FantiaProducts

# fantia.jp/products/<id>  -- the SHOP namespace, distinct from
# fantia.jp/posts/<id> (handled by the Fantia scraper).  One numeric id
# points at two unrelated objects; /products/ is never a fallback for
# /posts/ or vice versa.  See FantiaProducts.py for the live evidence table.
#
# Why this exists next to Fantia: Fantia covers both namespaces with one
# entry point.  FantiaProducts is the products-only build with deeper field
# extraction (schema.org Product block, unblurred image[], content_viewed
# tag[] / fanclub_category, catalogue-code detection).  Prefer it when your
# library is products-driven; either one works for members-only products
# once CookieCloud is configured.
#
# These three entries are all needed on Stash 0.31.1:
#   sceneByURL             UI "Search by URL" / Tagger URL search
#   sceneByQueryFragment   UI "Scrape with ... <scraper>" + URL
#                          (scene_input{url} routes here, NOT to sceneByURL)
#   sceneByFragment        UI "Scrape with ..." on a scene with no stored URL
#                          (scene_id -> the scene's own fields, e.g. title=887480)
# An XPath scraper can declare none of the fragment ones, which is exactly why
# the old scrapeXPath version answered "scraper operation not supported".

sceneByURL:
  - action: script
    url:
      - fantia.jp/products/
    script:
      - python
      - FantiaProducts.py
      - sceneByURL

sceneByQueryFragment:
  action: script
  script:
    - python
    - FantiaProducts.py
    - sceneByQueryFragment

sceneByFragment:
  action: script
  script:
    - python
    - FantiaProducts.py
    - sceneByFragment

# CookieCloud login (members-only products)
# --------------------------------------------------
# fantia.jp answers an anonymous request for a members-only product with the
# LOGIN page (HTTP 200, og:title "ログイン|ファンティア[Fantia]"), which used
# to make every member product scrape as a silent failure.  Configure one of:
#   1. env FANTIA_COOKIE='_session_id=...' on the Stash container
#   2. self-hosted CookieCloud via CC_COOKIECLOUD_URL / _KEY / _PASSWORD
# The CookieCloud request is deliberately proxy-free (the server is on the
# LAN); scraping fantia.jp itself still honours FANTIAPROD_PROXY /
# HTTPS_PROXY / HTTP_PROXY / ALL_PROXY, or a FantiaProducts.proxy file.
# Cookies are cached in-process and on disk for CC_TTL seconds (default 3600).

# Last Updated October 21, 2026
#  - Products below id 700000 no longer come back dateless: the id map is
#    not monotone there so no id-derived date is attempted, but the page's
#    own VideoObject.uploadDate does not depend on the map and is now used
#    as the answer.  The sample video is the right fallback because sellers
#    replace cover images (sale banners etc.) but essentially never
#    re-upload the sample -- verified live on 649825: cover Last-Modified
#    2026-10-13 vs sample uploadDate 2024-06-19.
#  - Studio is now the creator's circle/club name: schema.org
#    Product.brand.name is reported as studio (the site constant "Fantia.jp"
#    remains only as a fallback), the redundant director mapping is gone, and
#    brand extraction is guarded against non-dict shapes.  (Merged from the
#    v1.2.0 studio release.)
#  - Cross-check (user rule): when the page also carries a
#    VideoObject.uploadDate and it disagrees with the id-derived date by more
#    than 30 days, the OLDER of the two wins.  Both signals are upper bounds
#    on the publish date and every failure mode found in calibration
#    (non-monotone id ranges, extrapolation drift, a re-uploaded sample
#    video) pushes one of them later, never earlier -- so a large gap means
#    one signal is structurally wrong and the older date is the safer answer.
#    Small disagreements (<= 30 days) keep the id-derived value, which is the
#    more precise of the two.
#  - Release date is now derived from the product's numeric id.  fantia.jp
#    exposes no date field at all (no datePublished, no og:updated_time, no
#    date itemprop, no __INITIAL_STATE__, /api/products/<id> is 404 even when
#    logged in -- and the only ISO date in the page is the logged-in account's
#    membership_registration_date, i.e. the USER's signup date, which is never
#    used).  Product ids are issued sequentially, so id -> publication date is
#    a monotone mapping; the scraper ships a 221-anchor table calibrated
#    offline from ~1700 probed products (each anchor = min(cover-image
#    Last-Modified, VideoObject.uploadDate), both upper bounds on the publish
#    date, then made monotone by a suffix-minimum pass) and interpolates.
#    Measured leave-one-out accuracy vs dual-signal ground truth:
#      id >= 1040000  median 0d  p90 1d  max 1d
#      id >= 1000000  median 0d  p90 1d  max 33d
#      id >=  700000  median 0d  p90 2d  max 33d
#    Below id 700000 the map is not monotone, so older products get no date
#    rather than a wrong one.  Past the last anchor the date is extrapolated
#    with the trailing 14-day id rate (cap 60 days), then falls back to the
#    page's own VideoObject.uploadDate.  No image header is read at runtime.
#  - CookieCloud login support (FANTIA_COOKIE env or CC_COOKIECLOUD_* env),
#    with in-process + on-disk caching; members-only products now scrape
#  - Code no longer falls back to the whole og:title when 【...】 is absent
#  - Tags no longer leak the raw content_viewed blob when "tag" is absent
#  - fragment / query-fragment entries so the Stash UI can reach it