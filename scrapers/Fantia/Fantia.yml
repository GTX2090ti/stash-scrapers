name: Fantia

# Division of labour with FantiaProducts (2026-10-19)
# -----------------------------------------------------
#   Fantia         -> fantia.jp/posts/<id>     creator posts, JSON API
#   FantiaProducts -> fantia.jp/products/<id>  shop products, HTML, deeper extraction
#
# Both files used to declare fantia.jp/products/ under sceneByURL, so a URL
# search for a product matched whichever of the two Stash happened to pick.
# Fantia now claims posts only, which makes product URLs route to
# FantiaProducts automatically.  The fragment entries below are deliberately
# kept: "Scrape with ... Fantia" remains a working manual fallback, because
# fantia.py can still read a /products/ URL on its own.
sceneByURL:
  - action: script
    url:
      - fantia.jp/posts/
    script:
      - python
      - fantia.py
      - post
galleryByURL:
  - action: script
    url:
      - fantia.jp/posts/
    script:
      - python
      - fantia.py
      - post
# Upstream FantiaJp stops here -- and that is exactly why it never showed up
# in the "Scrape with ..." menu: that menu only lists scrapers whose
# supported_scrapes include FRAGMENT.  The two blocks below add it.
sceneByFragment:
  action: script
  script:
    - python
    - fantia.py
    - sceneByFragment
galleryByFragment:
  action: script
  script:
    - python
    - fantia.py
    - galleryByFragment
# Last Updated October 19, 2026 (URL split: posts here, products in FantiaProducts)
