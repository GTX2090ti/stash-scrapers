# MissAV scraper for Stash (action: script, pure Python stdlib)
#
# Why this exists instead of the community MissAV_en / MissAV_jp packages:
#   1. Those are XPath-only (action: scrapeXPath), and an XPath scraper cannot
#      declare a fragment entry -> "Scrape with ..." always answers
#      "scraper operation not supported".  This package is action: script and
#      declares four scene entries, so every UI action works.
#   2. The community XPath build reads performers from
#      //meta[@property="og:video:actor"] -- a tag that no longer exists on
#      missav.live, so its Performers field is permanently empty.  This build
#      reads the page's <span>Actress:</span> (EN) / <span>女优:</span> (CN) row
#      and implements performerByURL / performerByName as well.
#   3. Upstream has no mirror fallback; missav mirrors return 403 for some
#      egress IPs.  This build cycles missav.live then missav123.com.
#   4. Upstream only understands English labels, so the /cn/ locale parses to
#      nothing.  The label table here is bilingual.
#
# Entry points:
#   sceneByURL            -> Tagger "Search by URL" / scrapeURL prefix match
#   sceneByQueryFragment  -> UI "Scrape with ..." with a pasted URL
#                            (v0.31.1 routes this way, not via sceneByURL)
#   sceneByFragment       -> UI "Scrape with ..." on an existing scene
#                            (resolves the code from title / filename)
#   sceneByName           -> search by name or code, returns candidates
#   performerByURL        -> actress pages (/actresses/<Name>)
#   performerByName       -> actress lookup, returns candidate performers
#   * Declare all four scene entries: with only sceneByURL, pasting a URL into
#     the UI reports "not supported".

name: MissAV

# Why sceneByURL lists both mirrors:
#   sceneByURL matches by URL prefix.  It is often assumed that Stash then
#   fetches the matched page with its own Go HTTP client -- it does not.  For
#   action: script scrapers Stash only *selects* the scraper and hands the URL
#   to the script, which does its own fetching.  Measured 2026-10-08,
#   Stash v0.31.1, scrapeSceneURL:
#       urls: [missav123.com],           url = missav.live/... ->
#           "Internal system error: index out of range [0] with length 0"
#           -- it failed while selecting a scraper, before any page fetch;
#       urls: [missav.live, missav123.com], url = missav.live/... ->
#           normal result.
#   The HTTP 403 that missav.live returns to non-Python clients is real, but it
#   only affects scrapers where Stash fetches the page itself (action:
#   scrapeXPath).  It never reaches this script, because the request here is
#   made by Python.  So declare every mirror you want to match: a library
#   holding either URL form then still hits "Search by URL".
#   Stored URLs are nonetheless normalised to missav123.com (see
#   parse_scene), so the same scene reached through two mirrors dedupes to one
#   URL rather than two.
sceneByURL:
  - action: script
    url:
      - missav.live
      - missav123.com
    script:
      - python
      - missav.py
      - sceneByURL

sceneByQueryFragment:
  action: script
  script:
    - python
    - missav.py
    - sceneByQueryFragment

sceneByFragment:
  action: script
  script:
    - python
    - missav.py
    - sceneByFragment

sceneByName:
  action: script
  script:
    - python
    - missav.py
    - sceneByName

performerByName:
  action: script
  script:
    - python
    - missav.py
    - performerByName

performerByURL:
  - action: script
    url:
      - missav.live
      - missav123.com
    script:
      - python
      - missav.py
      - performerByURL
# Last Updated October 8, 2026
